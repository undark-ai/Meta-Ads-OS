title: Test
description: >
  One entry in the test register. A test without a kill number is not a test, it is a launch —
  the number is agreed before the test runs, not negotiated after it disappoints.
type: object
required: [test, hypothesis, primary_metric, kill_number, review_date]
properties:
  test: {type: string}
  test_type: {enum: [CREATIVE, AUDIENCE, OFFER, LANDING_PAGE, BID_STRATEGY, STRUCTURE, PLACEMENT, INCREMENTALITY]}
  hypothesis: {type: string}
  variable: {type: string, description: "the ONE thing that differs; two variables make the result unreadable"}
  baseline: {type: string}
  primary_metric: {type: string}
  guardrail_metric: {type: string}
  minimum_sample: {type: string, description: "purchases, not clicks — from learning-phase-and-significance"}
  kill_number: {type: string}
  review_date: {type: string}
  learning_phase_safe: {type: boolean, description: "false where the change would reset learning; that cost is stated up front"}
  owner: {type: string}
  result: {type: string}
  decision: {enum: [WIN, LOSE, INCONCLUSIVE, RUNNING, KILLED_EARLY]}
  learning_recorded: {type: boolean, description: "did the outcome reach the creative learning doc — an unrecorded result gets re-tested next quarter"}
