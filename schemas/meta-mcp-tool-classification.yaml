# Meta Ads MCP tool classification
#
# Every Meta Ads MCP tool is classified READ or WRITE. This file is the machine-readable
# source of truth for the audit/execution boundary described in CLAUDE.md and
# EXECUTION-PROTOCOL.md, and it is what scripts/validate-execution-boundary.py enforces:
#
#   - Audit agents (00-199) and audit skills may reference READ tools only.
#   - WRITE tools may be referenced only by execution agents (200+) and execution skills,
#     and may only be *called* under the protocol in EXECUTION-PROTOCOL.md.
#
# The tool names below are the bare Meta connector names. At runtime they are prefixed with
# the connector's server id (mcp__<SERVER_ID>__ads_get_ad_entities), and **that id differs per
# account** — so agents discover the real prefixed names rather than hardcoding them. The
# classification keys off the bare suffix, which is stable.
#
# Adding a tool: classify it. An unclassified tool is treated as WRITE by the validator —
# fail closed, never open. If Meta ships a tool this file has not seen, the audit lane
# refuses it until someone has looked at what it does.

version: 1
unclassified_default: WRITE

read:
  # --- account, entity and structure reads ---
  - ads_get_ad_accounts
  - ads_get_ad_entities
  - ads_get_ad_account_pages
  - ads_get_pages_for_business
  - ads_get_user_pages
  - ads_get_ig_accounts
  - ads_get_ig_media
  - ads_account_get_activity_logs     # change history — powers the trend/change band
  - ads_get_errors                    # delivery blockers
  - ads_get_opportunity_score
  - ads_get_field_context
  - ads_get_help_article

  # --- creative reads: the creative database is built from these ---
  - ads_get_creatives
  - ads_get_creative_ads
  - ads_get_ad_images
  - ads_get_ad_videos
  - ads_get_ad_preview                # renders inline in chat only; not embeddable in an artifact

  # --- insights and benchmarks ---
  - ads_insights_advertiser_context
  - ads_insights_performance_trend
  - ads_insights_anomaly_signal
  - ads_insights_auction_ranking_benchmarks
  - ads_insights_industry_benchmark

  # --- audiences ---
  - ads_get_ad_account_custom_audiences
  - ads_get_custom_audience
  - ads_get_custom_audience_adsets

  # --- measurement: pixel, datasets, conversions ---
  - ads_get_datasets
  - ads_get_dataset_details
  - ads_get_dataset_quality           # EMQ, dedup and match-key coverage
  - ads_get_dataset_stats
  - ads_get_customconversions
  - ads_pixel_event_read
  - ads_pixel_parameter_read

  # --- catalog reads ---
  - ads_catalog_get_catalogs
  - ads_catalog_get_details
  - ads_catalog_get_data_sources
  - ads_catalog_get_diagnostics
  - ads_catalog_get_dynamic_ads_health
  - ads_catalog_get_feed_rules
  - ads_catalog_get_product_details
  - ads_catalog_get_product_feed_details
  - ads_catalog_get_product_feed_upload_sessions
  - ads_catalog_get_product_product_sets
  - ads_catalog_get_product_set_details
  - ads_catalog_get_product_set_products
  - ads_catalog_get_product_sets
  - ads_catalog_get_businesses
  - ads_catalog_search_product
  - ads_catalog_list_catalogs             # the list_* family are reads; fail-closed was
  - ads_catalog_list_products             # blocking audit agents from them until 2026-08
  - ads_catalog_list_product_feeds
  - ads_catalog_list_product_sets
  - ads_catalog_list_partner_integrations
  - ads_catalog_event_source_get
  - ads_catalog_event_source_get_catalogs
  - ads_catalog_event_source_get_health
  - ads_catalog_event_source_get_recommendations

  # --- experiments: reading an existing test is a read ---
  - ads_experiment_list_tests
  - ads_experiment_abtest_get_test
  - ads_experiment_lift_get_test
  - ads_experiment_check_eligibility

  # --- competitive context ---
  - ads_library_search                # public Ad Library; competitor creative, not this account

write:
  # --- telemetry ---
  # Not a mutation of the ad account, but it does POST to Meta and it is not a read the audit
  # lane has any use for. Classified WRITE so the audit lane refuses it, which is what
  # unclassified_default would have done anyway — named here so the file matches the connector.
  - ads_log_ui_interaction

  # --- campaign build chain ---
  - ads_create_campaign
  - ads_create_ad_set
  - ads_create_ad
  - ads_create_creative
  - ads_update_entity                 # budgets, bids, status, targeting — the broadest write
  - ads_activate_entity               # the create-paused rule exists because of this one
  - ads_boost_ig_post

  # --- creative asset writes ---
  - ads_creative_update
  - ads_creative_delete
  - ads_creative_upload_image
  - ads_creative_upload_video
  - ads_creative_upload_media             # replaced the *_local_image family, which the
                                          # connector no longer exposes

  # --- audience writes ---
  - ads_create_custom_audience
  - ads_update_custom_audience
  - ads_update_custom_audience_users  # uploads PII; see the customer-data rule in EXECUTION-PROTOCOL.md
  - ads_delete_custom_audience

  # --- measurement writes: changing these rewrites the account's own history ---
  - ads_pixel_event_create
  - ads_pixel_event_update
  - ads_pixel_event_delete
  - ads_pixel_parameter_create
  - ads_pixel_parameter_update
  - ads_pixel_parameter_delete

  # --- catalog writes ---
  - ads_catalog_create
  - ads_catalog_update_catalog
  - ads_catalog_create_feed_rule
  - ads_catalog_delete_product
  - ads_catalog_create_product_feed
  - ads_catalog_create_product_feed_upload_session
  - ads_catalog_create_product_set
  - ads_catalog_product_create
  - ads_catalog_product_feed_delete
  - ads_catalog_product_feed_delete_rule
  - ads_catalog_product_set_delete
  - ads_catalog_update_product
  - ads_catalog_update_product_feed
  - ads_catalog_update_product_set
  - ads_catalog_event_source_connect
  - ads_catalog_event_source_disconnect

  # --- experiment writes: creating a test spends real budget ---
  - ads_experiment_abtest_create_test
  - ads_experiment_abtest_update_test
  - ads_experiment_lift_create_test

# Tools that read but still deserve care during an audit.
handle_with_care:
  ads_get_ad_preview:
    why: >
      Returns the rendered ad inline in chat only. The signed preview URLs are short-lived and
      require the viewer to be logged in to Facebook, so a preview link baked into a deliverable
      goes dead. Regenerate rather than promising permanence.
  ads_library_search:
    why: >
      Public data about other advertisers. Never present a competitor's Ad Library longevity as
      evidence that their ad is profitable — the Library shows what is running, not what works.
  ads_get_dataset_quality:
    why: >
      EMQ is Meta's own score of Meta's own matching. Report it as platform-stated, and
      corroborate against first-party order data before drawing a measurement conclusion.

# Names this repo believes the connector has superseded. Kept so the change is auditable and so
# FIELD-NOTES can name them. Treated as not-callable by the audit lane, and a reference gets a
# specific "retired" message rather than the generic unclassified one, because the fix is
# different — find the current name, do not classify the old one.
#
# This list is this repo's belief, not a fact about any particular account. A connector build may
# still expose a name listed here: on the first live run, all three below were still being served
# alongside the ads_creative_upload_media that superseded them. Verify against the live connector
# before concluding a tool is gone.
retired:
  - ads_creative_upload_local_image        # superseded by ads_creative_upload_media, 2026-08
  - ads_finalize_local_ad_image_upload     # superseded by ads_creative_upload_media, 2026-08
  - ads_delete_local_ad_image              # superseded by ads_creative_upload_media, 2026-08
